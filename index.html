<head>

<style>
:root{--bg:#0b0e13;--line:#2b3548;--text:#f7f8fb;--muted:#98a2b3;--orange:#ff9f1c;--green:#20c578;--red:#ff5b66}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 90% -10%,#29354b 0,transparent 34%),var(--bg);color:var(--text);min-height:100vh}
button,input,select{font:inherit}
.shell{max-width:1100px;margin:auto;padding:16px 14px 92px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.brand{font-size:26px;font-weight:950;letter-spacing:-1px}
.brand em{font-style:normal;color:var(--orange)}
.selectors{display:flex;gap:8px;flex-wrap:wrap}
.select{background:#151b25;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 10px;font-weight:700}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(430px,100%);background:#151b25;border:1px solid var(--line);border-radius:22px;padding:22px}
.login-card h1{margin:8px 0}
.login-card input{width:100%;margin-top:9px;background:#0f141c;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.login-card .primary{width:100%;margin-top:12px}
.error{color:#ff9da4;font-size:13px;margin-top:10px}
.view{display:none}
.view.active{display:block}
.grid{display:grid;grid-template-columns:1.04fr .96fr;gap:14px}
@media(max-width:780px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
.card{background:linear-gradient(180deg,rgba(24,30,42,.98),rgba(18,23,32,.98));border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 18px 48px rgba(0,0,0,.18)}
.card+.card{margin-top:14px}
.card h2{font-size:18px;margin:0 0 12px}
.muted,small{color:var(--muted)}
small{display:block;margin-top:2px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.big{font-size:34px;font-weight:950;letter-spacing:-1px}
.badge{font-size:11px;font-weight:900;padding:6px 9px;border-radius:999px}
.badge.ok{background:rgba(32,197,120,.14);color:#6af0b0;border:1px solid rgba(32,197,120,.35)}
.badge.danger{background:rgba(255,91,102,.12);color:#ff9da4;border:1px solid rgba(255,91,102,.3)}
.progress{height:9px;border-radius:99px;background:#0d1118;border:1px solid var(--line);overflow:hidden;margin:12px 0}
.progress>div{height:100%;background:linear-gradient(90deg,var(--green),var(--orange))}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:#0f141c;border:1px solid var(--line);border-radius:12px;padding:10px}
